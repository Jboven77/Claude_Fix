substitutions:
  device_name: lower-steps
  friendly_name: Lower-Steps

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  libraries:
    - "pololu/VL53L1X"
  includes:
    - vl53l1x_setup.h

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  level: DEBUG

api:
  encryption:
    key: "wCCSSEXoAghbIZ2Gmdr8sgaQaFd1cK2qSKHh3P6q2Mc="

ota:
  - platform: esphome
    password: "2709128908f68863b5709e9c97e0b1a1"

wifi:
  ssid: "BOVENS-MESH"
  password: "605506Jdb"
  ap:
    ssid: "Lower-Steps Fallback"
    password: "12345678"

captive_portal:

i2c:
  sda: GPIO20
  scl: GPIO21
  scan: true
  frequency: 400kHz

sensor:
  - platform: custom
    lambda: |-
      auto *tof_sensor = new VL53L1XSensor();
      App.register_component(tof_sensor);
      return {tof_sensor->distance_sensor};
    sensors:
      name: "Lower Steps Distance"
      id: lower_distance
      unit_of_measurement: "mm"
      accuracy_decimals: 0
      filters:
        - throttle: 0.25s

  - platform: wifi_signal
    name: "Lower Steps WiFi Signal"
    update_interval: 60s
