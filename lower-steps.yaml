substitutions:
  device_name: lower-steps
  friendly_name: Lower-Steps

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  libraries:
    - "pololu/VL53L1X"   # use the official Pololu driver
  includes:
    - vl53l1x_custom.h   # our own sensor implementation

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino   # required by this component

logger:
  level: DEBUG

api:
  encryption:
    key: "wCCSSEXoAghbIZ2Gmdr8sgaQaFd1cK2qSKHh3P6q2Mc="

ota:
  - platform: esphome   # DO NOT REMOVE
    password: "2709128908f68863b5709e9c97e0b1a1"

wifi:
  ssid: "BOVENS-MESH"
  password: "605506Jdb"
  ap:
    ssid: "Lower-Steps Fallback"
    password: "12345678"

captive_portal:

i2c:
  sda: GPIO20
  scl: GPIO21
  scan: true
  frequency: 400kHz

# Our custom VL53L1X sensor with Pololu library
sensor:
  - platform: custom
    lambda: |-
      auto *tof = new VL53L1XCustomSensor();
      App.register_component(tof);
      return { tof->distance_sensor };
    sensors:
      name: "Lower Steps Distance"
      id: lower_distance
      unit_of_measurement: "mm"
      accuracy_decimals: 0
      filters:
        # we can tweak these after we see real numbers
        - throttle: 0.25s

  - platform: wifi_signal
    name: "Lower Steps WiFi Signal"
    update_interval: 60s
