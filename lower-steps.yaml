substitutions:
  device_name: lower-steps
  friendly_name: Lower-Steps

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  level: DEBUG

api:
  encryption:
    key: "+6lkh+FkWq3HVFh6+NukfmN188wGMQap7sw2RK1p9Gg="

ota:
  - platform: esphome
    password: "48170f28ed94e6fe392d67906b01ff74"

wifi:
  ssid: "BOVENS-MESH"
  password: "605506Jdb"
  power_save_mode: none
  ap:
    ssid: "Lower-Steps Fallback"
    password: "12345678"

captive_portal:

i2c:
  sda: GPIO20
  scl: GPIO21
  scan: true
  frequency: 400kHz

sensor:
  - platform: vl53l0x
    id: lower_distance
    name: "Distance"
    update_interval: 200ms
    long_range: true
    timeout: 50ms
    accuracy_decimals: 2

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

binary_sensor:
  - platform: template
    id: step_occupied
    name: "Step Occupied"
    lambda: |-
      if (isnan(id(lower_distance).state)) {
        return false;
      }
      return id(lower_distance).state < 1.02;

text_sensor:
  - platform: version
    name: "ESPHome Version"

  - platform: wifi_info
    ip_address:
      name: "IP Address"
