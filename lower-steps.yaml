substitutions:
  device_name: tof-doesnt-matter
  friendly_name: TOF-DOESNT-MATTER

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  level: DEBUG

# External component to enable VL53L1X support
external_components:
  - source:
      type: git
      url: https://github.com/ssieb/esphome_components
    components: [ vl53l1x ]

api:
  encryption:
    key: "+6lkh+FkWq3HVFh6+NukfmN188wGMQap7sw2RK1p9Gg="

ota:
  - platform: esphome
    password: "48170f28ed94e6fe392d67906b01ff74"

wifi:
  ssid: "BOVENS-MESH"
  password: "605506Jdb"
  power_save_mode: none
  ap:
    ssid: "Lower-Steps Fallback"
    password: "12345678"

captive_portal:

i2c:
  sda: GPIO20
  scl: GPIO21
  scan: true
  frequency: 100kHz  # Reduced from 400kHz for better stability

sensor:
  # VL53L1X with external component (longer range, up to 4m)
  - platform: vl53l1x
    id: lower_distance
    name: "Distance"
    address: 0x29
    update_interval: 1s
    unit_of_measurement: "m"
    accuracy_decimals: 2

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

binary_sensor:
  - platform: template
    id: step_occupied
    name: "Step Occupied"
    lambda: |-
      if (isnan(id(lower_distance).state)) {
        return false;
      }
      // Trigger when distance is less than 1.02 meters (102 cm)
      return id(lower_distance).state < 1.02;
    filters:
      - delayed_on: 100ms  # Debounce - must be occupied for 100ms
      - delayed_off: 500ms  # Stay on for 500ms after no longer detected

text_sensor:
  - platform: version
    name: "ESPHome Version"

  - platform: wifi_info
    ip_address:
      name: "IP Address"
